<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Machine - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="layout-redesign.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header injected by header.js -->

    <main class="main">
        <div class="container">
            <div class="dashboard-grid"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 2rem;">

                <!-- Create Analysis Card -->
                <div class="card">
                    <h2>🚀 New Analysis</h2>
                    <p class="card-description">Analyze TOP-10 search results for a keyword.</p>

                    <form id="createAnalysisForm" class="form">
                        <div class="form-group">
                            <label for="keyword">Keyword *</label>
                            <input type="text" id="keyword" name="keyword" placeholder="e.g. seo optimization" required
                                minlength="2">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="language">Language</label>
                                <select id="language" name="language">
                                    <option value="uk">🇺🇦 Ukrainian</option>
                                    <option value="en">🇬🇧 English</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="location">Location</label>
                                <input type="text" id="location" name="location" value="Ukraine">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span class="btn-text">Start Analysis</span>
                            <span class="btn-loader hidden">
                                <span class="spinner"></span>
                                Processing...
                            </span>
                        </button>
                    </form>
                </div>

                <!-- Recent Analyses (Placeholder) -->
                <div class="card">
                    <h2>🕒 Recent History</h2>
                    <p class="card-description">Your recent projects.</p>
                    <div class="history-list">
                        <p style="color: var(--text-secondary); font-style: italic;">No recent history found.</p>
                        <!-- TODO: Implement history list -->
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="card">
                    <h2>⚡ Quick Actions</h2>
                    <div class="action-list" style="display: flex; flex-direction: column; gap: 1rem;">
                        <a href="editor.html" class="btn btn-secondary" style="text-align: center;">
                            Open Editor (Empty)
                        </a>
                        <a href="competitors.html" class="btn btn-secondary" style="text-align: center;">
                            View Competitors
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>SEO Machine v2.0 | <a href="https://github.com/prodan655-png/SEO_Machine_2" target="_blank">GitHub</a>
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="components/header.js"></script>
    <script src="js/dashboard.js?v=2"></script>
</body>

</html>
