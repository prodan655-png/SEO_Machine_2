<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Machine - Editor</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="layout-redesign.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header injected by header.js -->

    <main class="main" style="padding: 0;">
        <div class="surfer-layout">
            <!-- LEFT COLUMN: Workflow Sidebar -->
            <aside class="workflow-sidebar">
                <h3>WORKFLOW</h3>

                <!-- Get Started -->
                <div class="workflow-step">
                    <div class="workflow-step-header completed">
                        <div class="workflow-step-icon">🎯</div>
                        <div class="workflow-step-title">Get Started</div>
                    </div>
                    <ul class="workflow-actions">
                        <li class="workflow-action">
                            <button class="workflow-action-btn" id="btn-view-competitors">
                                📊 View Competitors
                            </button>
                        </li>
                        <li class="workflow-action">
                            <button class="workflow-action-btn" id="btn-generate-brief">
                                📋 Generate Brief
                            </button>
                        </li>
                    </ul>
                </div>

                <!-- Write & Optimize -->
                <div class="workflow-step">
                    <div class="workflow-step-header active">
                        <div class="workflow-step-icon">✍️</div>
                        <div class="workflow-step-title">Write & Optimize</div>
                    </div>
                    <ul class="workflow-actions">
                        <li class="workflow-action">
                            <button class="workflow-action-btn" id="btn-ai-writer">🤖 AI Writer</button>
                        </li>
                        <li class="workflow-action">
                            <button class="workflow-action-btn" id="btn-auto-optimize">⚡ Auto-Optimize</button>
                        </li>
                        <li class="workflow-action">
                            <button class="workflow-action-btn" id="btn-generate-images">🎨 Generate Images</button>
                        </li>
                    </ul>
                </div>

                <!-- Review -->
                <div class="workflow-step">
                    <div class="workflow-step-header">
                        <div class="workflow-step-icon">🔍</div>
                        <div class="workflow-step-title">Review</div>
                    </div>
                    <ul class="workflow-actions">
                        <li class="workflow-action">
                            <button class="workflow-action-btn" id="btn-check-score">📊 Check Score</button>
                        </li>
                        <li class="workflow-action">
                            <button class="workflow-action-btn" id="btn-seo-coach">🎓 SEO Coach</button>
                        </li>
                    </ul>
                </div>

                <!-- Publish -->
                <div class="workflow-step">
                    <div class="workflow-step-header">
                        <div class="workflow-step-icon">🚀</div>
                        <div class="workflow-step-title">Publish</div>
                    </div>
                    <ul class="workflow-actions">
                        <li class="workflow-action">
                            <button class="workflow-action-btn" id="btn-export-html">📤 Export HTML</button>
                        </li>
                        <li class="workflow-action">
                            <button class="workflow-action-btn" id="btn-copy-code">📋 Copy Code</button>
                        </li>
                    </ul>
                </div>
            </aside>

            <!-- CENTER COLUMN: Editor Area -->
            <main class="editor-area">
                <div class="editor-header">
                    <h2 class="editor-title">✍️ Content Editor <span id="current-keyword"
                            style="font-weight: normal; font-size: 0.9em; color: var(--text-secondary); margin-left: 10px;"></span>
                    </h2>
                </div>

                <div class="editor-toolbar">
                    <button class="toolbar-btn active" id="mode-html">💻 HTML</button>
                    <button class="toolbar-btn" id="mode-preview">📄 Preview</button>
                </div>

                <!-- HTML Editor -->
                <div class="editor-container">
                    <textarea id="draftContent" class="content-editor" placeholder="Paste your HTML or text here..."
                        style="min-height: 600px;"></textarea>

                    <!-- Preview Container (Hidden by default) -->
                    <div id="previewContainer" class="hidden"
                        style="background: white; color: #1a1a1a; padding: 2rem; min-height: 600px; overflow-y: auto;">
                    </div>

                    <div class="editor-stats"
                        style="margin-top: 1rem; padding: 0.5rem; background: rgba(59, 130, 246, 0.1); border-radius: 4px;">
                        <span>Words: <strong id="wordCount" x-data x-text="$store.app.wordCount">0</strong></span>
                        <span style="margin-left: 2rem;">Chars: <strong id="charCount" x-data
                                x-text="$store.app.charCount">0</strong></span>
                    </div>
                </div>
            </main>

            <!-- RIGHT COLUMN: Guidelines Sidebar -->
            <aside class="guidelines-sidebar" x-data>
                <div class="guidelines-header">
                    <h3 class="guidelines-title">📋 Guidelines</h3>
                </div>

                <!-- Content Score Widget -->
                <div class="score-widget">
                    <div class="score-circle-small">
                        <svg viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(30, 41, 59, 0.6)"
                                stroke-width="8" />
                            <circle id="score-circle-fill" cx="60" cy="60" r="54" fill="none" stroke="#3b82f6"
                                stroke-width="8" stroke-dasharray="339"
                                :stroke-dashoffset="339 - (339 * $store.app.score / 100)" stroke-linecap="round"
                                style="transition: stroke-dashoffset 1s ease;" />
                        </svg>
                        <div class="score-value-small" x-text="$store.app.score">0</div>
                    </div>
                    <span class="score-label-small">CONTENT SCORE</span>
                </div>

                <!-- Important Terms -->
                <div class="guidelines-section">
                    <h4 class="guidelines-section-title">
                        <span class="icon">🔑</span>
                        Important Terms
                    </h4>
                    <ul class="terms-list">
                        <template x-if="$store.app.terms.length === 0">
                            <li style="color: var(--text-secondary); padding: 0.5rem;">Run analysis to see terms...</li>
                        </template>

                        <template x-for="term in $store.app.terms" :key="term.term">
                            <li class="term-item" :class="{
                                    'status-good': term.status === 'good',
                                    'status-low': term.status === 'low',
                                    'status-high': term.status === 'high'
                                }">
                                <span class="term-text" x-text="term.term"></span>
                                <span class="term-count">
                                    <span x-text="term.count"></span>/<span x-text="term.max"></span>
                                </span>
                                <div class="term-progress">
                                    <div class="term-progress-bar"
                                        :style="`width: ${Math.min((term.count / term.max) * 100, 100)}%`"></div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>

                <!-- Content Structure -->
                <div class="guidelines-section">
                    <h4 class="guidelines-section-title">
                        <span class="icon">📊</span>
                        Content Structure
                    </h4>
                    <ul class="metrics-list">
                        <!-- Word Count -->
                        <li class="metric-item">
                            <span class="metric-label">Words</span>
                            <span class="metric-value">
                                <span x-text="$store.app.wordCount"></span>
                                <span class="metric-target" x-show="$store.app.structure.word_count">
                                    / <span x-text="$store.app.structure.word_count?.recommended_min || '800+'"></span>
                                </span>
                            </span>
                        </li>

                        <!-- Headings -->
                        <li class="metric-item">
                            <span class="metric-label">Headings</span>
                            <span class="metric-value">
                                <span x-text="$store.app.structure.headings?.current || 0"></span>
                                <span class="metric-target" x-show="$store.app.structure.headings">
                                    / <span x-text="$store.app.structure.headings?.recommended_min || '3+'"></span>
                                </span>
                            </span>
                        </li>

                        <!-- Paragraphs -->
                        <li class="metric-item">
                            <span class="metric-label">Paragraphs</span>
                            <span class="metric-value">
                                <span x-text="$store.app.structure.paragraphs?.current || 0"></span>
                                <span class="metric-target" x-show="$store.app.structure.paragraphs">
                                    / <span x-text="$store.app.structure.paragraphs?.recommended_min || '5+'"></span>
                                </span>
                            </span>
                        </li>
                    </ul>
                </div>
            </aside>
        </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="components/header.js"></script>
    <script src="diff-tracking.js"></script>
    <script src="keyword-highlighting.js"></script>
    <script src="js/editor.js?v=8"></script>
</body>

</html>
